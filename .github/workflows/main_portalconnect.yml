# Build and deploy PortalConnect to Azure App Service.
#
# Only the build output and the production dependency manifest are shipped —
# not the whole source tree — so the deployed package stays small and contains
# no test or tooling code.
name: Build and deploy to Azure Web App - PortalConnect

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24.x'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          npm run test:api

      - name: Build web and API
        run: npm run build:all

      # Assemble exactly what the App Service needs to run.
      - name: Assemble deployment package
        run: |
          mkdir -p deploy/server
          cp -r dist deploy/dist
          cp -r server/dist deploy/server/dist
          cp -r server/src/db/migrations deploy/server/migrations
          cp package.json package-lock.json deploy/
          cp server/package.json deploy/server/package.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: PortalConnect
          slot-name: Production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BF40442C4C16403ABAC030B6B8C90303 }}
          package: .
